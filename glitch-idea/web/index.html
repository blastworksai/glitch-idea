<!doctype html>
<!-- glitch-idea browser shell; Blastworks Applications look. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Glitch idea</title>
  <link rel="stylesheet" href="./assets/bwpm/bundle.css">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#step-panel">Skip to current step</a>
  <div class="g-app">
    <header class="bw-appbar">
      <a class="bw-appbar__brand" href="./"><img src="./assets/logo.svg" alt="Blastworks" width="28" height="28">Glitch idea</a>
      <nav id="app-nav" class="bw-tabs" aria-label="Main">
        <button id="nav-idea" type="button" class="bw-tab">Idea</button>
        <button id="nav-ideas" type="button" class="bw-tab">Ideas</button>
        <button id="nav-setup" type="button" class="bw-tab">Setup</button>
      </nav>
      <div class="bw-appbar__spacer"></div>
      <ol class="g-apiv" aria-label="APIV: Align, Plan, Implement, Verify"><li aria-current="step"><b>Align</b><span class="sr-only">, you're here; next: /glitch-plan</span></li><li><span aria-hidden="true">› </span>Plan</li><li><span aria-hidden="true">› </span>Implement</li><li><span aria-hidden="true">› </span>Verify</li></ol>
      <span id="agent-status" class="g-agent" role="status"></span>
      <button id="theme-toggle" type="button" class="bw-btn bw-btn--ghost" aria-pressed="false">Light theme</button>
      <span id="save-status" class="bw-meta" role="status" aria-live="polite">Connecting…</span>
    </header>
    <section id="connection" class="connection" aria-label="Connect this browser" hidden></section>
    <div class="g-body">
      <aside id="step-rail" class="g-rail" aria-label="Idea steps">
        <div class="g-rail__head">
          <span id="identity" class="bw-meta">New idea</span>
          <span id="rail-title" class="g-rail__title"></span>
          <span id="progress" class="bw-progress">0 of 8 saved</span>
        </div>
        <nav id="compact-nav" aria-label="Idea steps"></nav>
        <hr class="g-divider">
        <div class="g-rail__foot"><span class="bw-caption">When all eight are saved</span><span class="g-sub">Review builds the planning prompt for <code>/glitch-plan</code>.</span></div>
      </aside>
      <main id="columns" class="g-main" aria-label="Idea workflow"></main>
    </div>
  </div>
  <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
  <noscript>This local guided workflow requires JavaScript.</noscript>
</body>
</html>
